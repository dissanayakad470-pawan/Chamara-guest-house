name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Chamara Resort project
        run: |
          rm -rf project
          mkdir project
          unzip -q chamara-resort.zip -d project
          cp -a project/. .
          rm -rf project

      - name: Create env example
        run: |
          touch .env.example

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Make Gradle wrapper executable
        run: |
          chmod +x gradlew

      - name: Fix debug signing
        run: |
          sed -i '/signingConfigs {/,/}/d' app/build.gradle.kts || true

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chamara-Resort-APK
          path: app/build/outputs/apk/debug/*.apk
