name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q guest-house-billing.zip -d project
          cp -r project/* .
          rm -rf project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Fix debug signing
        run: sed -i '/debug { signingConfig = signingConfigs.getByName("debugConfig") }/d' app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guest-house-billing-apk
          path: app/build/outputs/apk/debug/*.apk
